name: Build profile assets

# Regenerates everything README.md loads from the `output` branch:
# the contribution snake plus the cards, roadmap and stats built from data/profile.json.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Runs before the snake step: that action runs in Docker as root, and a dist/
      # it creates first is not writable by this step.
      - name: Generate cards, roadmap and stats
        run: python3 scripts/build_profile.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#9D6FE0&color_dots=#2f1a44,#5a3a80,#8257b5,#9D6FE0,#c9a7ef

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
